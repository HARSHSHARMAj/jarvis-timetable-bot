name: Jarvis 24/7 Timetable Notifier

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Jarvis Alert
        run: python jarvis_notify.py
